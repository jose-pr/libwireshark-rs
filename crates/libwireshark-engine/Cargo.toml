[package]
name = "libwireshark-engine"
description = "Wireshark's dissection engine in your process: dissect frames and read captures with Wireshark and the plugins it loads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*"]
# guatiao comes from a git revision until a release carries what this needs.
publish = false

[lib]
# The cdylib is the guatiao provider library (with `provider`); Rust users
# link the rlib.
crate-type = ["rlib", "cdylib"]

[features]
# Exports the engine as a guatiao provider of `wireshark_engine`. Only for
# the library a guatiao host loads: two crates exporting providers do not
# link into one library.
provider = ["dep:guatiao"]

[dependencies]
libwireshark-sys.workspace = true
libwireshark-api.workspace = true
guatiao = { workspace = true, features = ["provider"], optional = true }
libloading.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Built beside the test binaries so `tests/engine.rs` can load them.
[dev-dependencies]
libwireshark.workspace = true
basic-dissector = { path = "../../examples/basic-dissector" }
multi-protocol = { path = "../../examples/multi-protocol" }

[lints]
workspace = true
