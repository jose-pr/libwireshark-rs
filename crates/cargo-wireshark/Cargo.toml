[package]
name = "cargo-wireshark"
description = "Cargo subcommand for Wireshark plugin development: find the installation, and generate, fetch or publish libwireshark-sys header bundles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["development-tools::cargo-plugins", "network-programming"]
readme = "README.md"
exclude = [".*", "*.local.*"]

[dependencies]
bindgen.workspace = true
clap.workspace = true
sha2.workspace = true
sevenz-rust2.workspace = true
ureq.workspace = true
zip.workspace = true
lzma-rust2.workspace = true
tar.workspace = true

[lints]
workspace = true

# Writers for the extraction tests' hostile archives.
[dev-dependencies]
sevenz-rust2 = { workspace = true, features = ["compress"] }
lzma-rust2 = { workspace = true, features = ["encoder"] }
