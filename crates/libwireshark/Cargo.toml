[package]
name = "libwireshark"
description = "Write Wireshark dissector plugins in Rust: a trait per protocol, typed preferences and fields, one macro for the plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# It links or embeds Wireshark, which is GPL-2.0-or-later.
license = "GPL-2.0-or-later"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
exclude = [".*", "*.local.*"]

[features]
default = []
# `#[derive(Header)]` and `#[derive(Preferences)]`, re-exported from the root.
derive = ["dep:libwireshark-derive"]
# `libwireshark::engine`: Wireshark's dissection engine in a program (not a
# plugin), from Wireshark 4.6.
host = ["dep:libc"]

[dependencies]
libwireshark-sys.workspace = true
libwireshark-derive = { workspace = true, optional = true }
libloading.workspace = true

[target.'cfg(unix)'.dependencies]
# `dladdr`, to find the libraries beside libwireshark.
libc = { version = "0.2", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

# Built beside the test binaries so `tests/tshark.rs` can load them.
[dev-dependencies]
audio-codec = { path = "../../examples/audio-codec" }
basic-dissector = { path = "../../examples/basic-dissector" }
capture-file = { path = "../../examples/capture-file" }
multi-protocol = { path = "../../examples/multi-protocol" }
runtime-protocol = { path = "../../examples/runtime-protocol" }
stream-protocol = { path = "../../examples/stream-protocol" }

[[test]]
name = "host"
required-features = ["host"]
