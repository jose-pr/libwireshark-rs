language = "C"
include_guard = "LIBWIRESHARK_API_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
sys_includes = ["guatiao.h"]

header = """
/*
 * libwireshark_api -- the kind tables of a Wireshark plugin written in C,
 * as libwireshark-guatiao loads it.
 *
 * GENERATED BY cbindgen from build.rs, by expanding #[guatiao::kind].
 * DO NOT EDIT. Regenerate with:
 *   GUATIAO_WRITE_HEADER=1 cargo build -p libwireshark-api --features c-header
 *
 * A C provider fills a wireshark_dissector_vtable (header.struct_size is
 * sizeof the table, header.floor_hash the *_FLOOR_HASH macro beside it)
 * and offers it from its own guatiao_library_entry, declaring
 * kind=wireshark_dissector. The host lends a wireshark_packet object for
 * each dissect call: call its slots during the call, never keep it, never
 * call its destroy. dissect's conversation map is lent too.
 *
 * wireshark_engine and wireshark_session go the other way: the
 * libwireshark-engine library provides them, and a host opens a session
 * to dissect frames and read captures with Wireshark itself.
 */
"""

[export]
include = ["DissectorVtable", "PacketVtable", "EngineVtable", "SessionVtable"]

[export.rename]
"DissectorVtable" = "wireshark_dissector_vtable"
"PacketVtable" = "wireshark_packet_vtable"
"EngineVtable" = "wireshark_engine_vtable"
"SessionVtable" = "wireshark_session_vtable"

[parse]
parse_deps = false

[parse.expand]
crates = ["libwireshark-api"]
