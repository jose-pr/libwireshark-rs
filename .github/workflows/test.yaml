name: Test

# On demand, or for a throwaway `ci-*` tag (delete it afterwards). Not run
# on branch pushes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that builds without Wireshark: the CLI and the derives.
  tooling:
    name: Tooling (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p cargo-wireshark -p libwireshark-derive --all-targets -- -D warnings
      - run: cargo test -p cargo-wireshark -p libwireshark-derive

  # The runtime and the example plugins against an installed Wireshark,
  # loaded by its tshark.
  plugins:
    name: Plugins (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Wireshark (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark libwireshark-dev libclang-dev
      - name: Install Wireshark (macOS)
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Install Wireshark (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install wireshark --no-progress -y
          # The engine's tests load libwireshark into their own process.
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Fetch the header bundles
        run: cargo run -p cargo-wireshark -- wireshark headers fetch
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Load the example plugins in tshark
        run: cargo test -p libwireshark --all-features --test tshark -- --ignored
      - name: Dissect in this process with the engine
        run: cargo test -p libwireshark-engine --all-features --test engine -- --ignored
      # The guatiao host's providers: Rust, C (compiled by the test) and
      # Python, through guatiao's Python bridge, built from the revision the
      # workspace pins, against this job's Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The libwireshark Python package
        shell: bash
        run: |
          python -m pip install -e "bindings/python[dev]"
          (cd bindings/python && python -m black --check src tests)
          python -m pytest -q -rs bindings/python
      - name: Build guatiao's Python bridge
        shell: bash
        run: |
          rev=$(sed -n 's/^guatiao = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          git clone --filter=blob:none https://github.com/Boriken-Dev/guatiao "$RUNNER_TEMP/guatiao"
          git -C "$RUNNER_TEMP/guatiao" checkout "$rev"
          PYO3_PYTHON="$(python -c "import sys; print(sys.executable)")" cargo build --manifest-path "$RUNNER_TEMP/guatiao/crates/guatiao-py/Cargo.toml"
          cargo build --manifest-path "$RUNNER_TEMP/guatiao/Cargo.toml" -p guatiao --features load
          echo "LIBWIRESHARK_TEST_GUATIAO=$RUNNER_TEMP/guatiao" >> "$GITHUB_ENV"
          echo "GUATIAO_LIBRARY=$RUNNER_TEMP/guatiao/target/debug" >> "$GITHUB_ENV"
      - name: Load dissectors from Rust, C and Python through the guatiao host
        env:
          LIBWIRESHARK_TEST_REQUIRE_ALL: "1"
        run: cargo test -p libwireshark-guatiao --test tshark -- --ignored
      # The engine as a guatiao provider, driven by the Python package with
      # the example plugins and the guatiao host loaded.
      - name: Run Wireshark from Python
        shell: bash
        run: |
          cargo build -p libwireshark-engine --features provider -p libwireshark-guatiao -p guatiao-rust-provider -p basic-dissector
          case "$RUNNER_OS" in
            Windows) engine="$(cygpath -w "$PWD/target/debug/libwireshark_engine.dll")" ;;
            macOS) engine="$PWD/target/debug/liblibwireshark_engine.dylib" ;;
            *) engine="$PWD/target/debug/liblibwireshark_engine.so" ;;
          esac
          LIBWIRESHARK_ENGINE="$engine" python -m pytest -q -rs bindings/python/tests/test_engine.py

  # The runtime type-checks against every release line's bindings.
  release-lines:
    name: Release line ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["3.0", "3.2", "3.4", "3.6", "4.0", "4.2", "4.4", "4.6"]
    env:
      WIRESHARK_NO_LINK: "1"
      WIRESHARK_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p cargo-wireshark -- wireshark headers fetch
      - run: cargo check -p libwireshark --all-features -p basic-dissector -p multi-protocol -p stream-protocol -p capture-file -p audio-codec -p runtime-protocol -p libwireshark-guatiao
      - run: cargo check -p libwireshark-engine --all-features --all-targets

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      WIRESHARK_NO_LINK: "1"
      WIRESHARK_VERSION: "4.6"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p cargo-wireshark -- wireshark headers fetch
      - run: cargo doc --workspace --no-deps --all-features
      - name: The published crates carry their headers and no private files
        run: |
          cargo package --list -p libwireshark-sys --allow-dirty > sys.txt
          grep -q '^headers/wireshark-4-6.h$' sys.txt
          grep -q '^headers/deps-linux-x86_64.h$' sys.txt
          for crate in libwireshark libwireshark-derive libwireshark-sys cargo-wireshark; do
            cargo package --list -p "$crate" --allow-dirty > files.txt
            grep -q '^AGENTS.md$' files.txt
            grep -q '^README.md$' files.txt
            grep -q '^LICENSE$' files.txt
            ! grep -v '^\.cargo_vcs_info\.json$' files.txt | grep -q '^\.'
          done
